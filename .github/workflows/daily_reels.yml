name: Otomatik Instagram Kombin Reels (Günde 3 Kez)

on:
  workflow_dispatch: # Yalnızca manuel tetikleme (Yerel güvenli cihaz otomasyonu aktif olduğu için bulut cron kapalıdır)
    inputs:
      slot_name:
        description: 'Paylaşım Kuşağı (sabah / oglen / aksam)'
        required: false
        default: 'deneme'
      dry_run:
        description: 'Sadece videoyu üret, Instagrama yükleme (true/false)'
        required: false
        default: 'true'

jobs:
  create-and-publish-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Proje Dosyalarını Çek
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 FFmpeg ve Sistem Kütüphanelerini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation libgl1

      - name: 📦 Python Paketlerini Yükle (Ücretsiz / Açık Kaynak)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 👗 Günlük Kombin Oluştur + Graph Motion & Yürüyen Model Reels Üret
        env:
          IG_WATERMARK: ${{ vars.IG_WATERMARK || '@guzelaicom' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SLOT_NAME: ${{ github.event.inputs.slot_name || 'otomatik' }}
        run: |
          python src/main.py --output output/daily_kombin_reel.mp4

      - name: 📤 Videoyu ve Threads Link Zincirini Artifacts Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: kombin-reels-${{ github.run_number }}
          path: |
            output/daily_kombin_reel.mp4
            output/kombin_collage.png
            output/model_street.png
            output/caption.txt
            output/comment_links.txt
            output/threads_post.txt
            output/threads_thread.json
            output/telegram_post.html
            output/telegram_post.json
            output/pinterest_pin.txt
            output/pinterest_pin.json
            output/outfit_links.json
          retention-days: 7

      - name: 📱 Instagram Reels, Threads & Telegram Olarak Otomatik Paylaş
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/instagram_uploader.py --video output/daily_kombin_reel.mp4 --caption-file output/caption.txt
          python src/telegram_publisher.py --outfit-json output/outfit_links.json --publish
