name: GuzelAI.com 7/24 Otonom Medya, SEO & Kombin Reels Sistemi (Bulut + Yerel)

on:
  workflow_dispatch:
    inputs:
      slot_name:
        description: 'Paylaşım Kuşağı (sabah / oglen / aksam / otomatik)'
        required: false
        default: 'otomatik'
      dry_run:
        description: 'Bulut IP Koruması: Sadece 2K Reels + GuzelAI.com vitrin üret, Instagram yüklemesini yerel TR IPye bırak (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  create-and-publish-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Proje Dosyalarını Çek
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GUZELAI_PAT || secrets.GITHUB_TOKEN }}

      - name: 🐍 Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 FFmpeg ve Sistem Kütüphanelerini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation libgl1

      - name: 📦 Python Paketlerini Yükle
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 👗 Tarih & Konsept Otomasyonu + 2K QHD+ Graph-Motion Reels + GuzelAI.com Vitrin Güncellemesi
        env:
          IG_WATERMARK: ${{ vars.IG_WATERMARK || '@guzelaicom' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GUZELAI_PAT || secrets.GITHUB_TOKEN }}
          SLOT_NAME: ${{ github.event.inputs.slot_name || 'otomatik' }}
        run: |
          python src/main.py --output output/daily_kombin_reel.mp4

      - name: 📤 2K Reels, Hook Kapak ve Kalite Raporunu Artifacts Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: kombin-reels-2k-${{ github.run_number }}
          path: |
            output/daily_kombin_reel.mp4
            output/hook_cover.jpg
            output/kombin_collage.png
            output/model_street.png
            output/caption.txt
            output/quality_check_report.json
            output/outfit_links.json
          retention-days: 7

      - name: 📱 Resmi Graph API Kontrolü (Bulut IP Güvenli Mod)
        if: ${{ github.event.inputs.dry_run == 'false' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ secrets.GUZELAI_PAT || secrets.GITHUB_TOKEN }}
          IG_ENABLE_UPLOAD: '1'
        run: |
          if [ -n "$IG_ACCESS_TOKEN" ]; then
            python src/instagram_uploader.py --video output/daily_kombin_reel.mp4 --caption-file output/caption.txt
          else
            echo "Bulut IP Koruması: Resmi IG_ACCESS_TOKEN tanımlı değil, Türkiye IP oturumu korundu."
          fi

      - name: 💾 Yayınlanan Kombin Geçmişini Depoya Kaydet (Tekrar Paylaşım Koruması)
        if: ${{ always() }}
        run: |
          git config user.name "GuzelAI Media Bot"
          git config user.email "bot@guzelai.com"
          git add output/published_history.json output/instagram_uploaded_history.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore(history): sync published outfit & model history [skip ci]" && git push)
